name: Publish

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const pkg of ["core", "terrain", "raster", "vector"]) {
              const { version } = JSON.parse(readFileSync(`packages/${pkg}/package.json`));
              if (`v${version}` !== process.env.RELEASE_TAG) process.exit(1);
            }
          '
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/release.test.mjs
      - name: Pack and validate all packages
        run: node scripts/release.mjs pack "$RUNNER_TEMP/release-artifacts"
      - name: Preserve reviewed artifacts before publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check tooling
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);
          ' "$(npm --version)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts
      - name: Publish exact reviewed tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs publish "$RUNNER_TEMP/release-artifacts"
